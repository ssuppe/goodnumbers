<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoodNumbers - Color Palette Demo</title>
    <style>
      /* 
         * ===============================================
         * Design System: V1 - Colors & Base Styles
         * ===============================================
         * This defines the core visual identity. Using CSS variables 
         * allows for easy theming (e.g., dark mode) later.
        */
      :root {
        /* Brand & Interactive Colors */
        --primary-color: #2e7d32; /* A strong, trustworthy green for primary actions. */
        --primary-color-hover: #388e3c; /* A slightly lighter green for hover states. */
        --primary-color-active: #1b5e20; /* A darker green for pressed/active states. */

        /* Neutral Colors */
        --background-color: #f8f9fa; /* A very light, off-white for main backgrounds. */
        --text-color-primary: #212529; /* Dark gray for primary text, high contrast. */
        --text-color-secondary: #6c757d; /* Lighter gray for secondary or placeholder text. */
        --border-color: #dee2e6; /* Light gray for borders and dividers. */
        --component-background-color: #ffffff; /* Pure white for cards and inputs. */

        /* UI Accents & Feedback Colors */
        --feedback-critical-color: #d32f2f; /* Red for critical warnings/errors. */
        --feedback-info-color: #1976d2; /* Blue for informational messages. */

        /* Universal Styling Properties */
        --border-radius-standard: 8px; /* Standard radius for curved corners on buttons, cards. */
        --box-shadow-light: 0 2px 5px rgba(0, 0, 0, 0.07); /* Subtle shadow for depth. */
      }

      /* Base Page Styles */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: var(--background-color);
        color: var(--text-color-primary);
        margin: 0;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        box-sizing: border-box;
      }

      .demo-container {
        text-align: center;
        padding: 2rem;
        background-color: var(--component-background-color);
        border-radius: var(--border-radius-standard);
        box-shadow: var(--box-shadow-light);
      }

      h1 {
        color: var(--text-color-primary);
        margin-bottom: 0.5rem;
      }

      p {
        color: var(--text-color-secondary);
        margin-top: 0;
        margin-bottom: 2rem;
        max-width: 400px;
      }

      /* 
         * ===============================================
         * Component: Primary Button
         * ===============================================
        */
      .btn-primary {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        font-weight: 600;
        color: #ffffff; /* White text for contrast against the green background */
        background-color: var(--primary-color);
        border: none;
        border-radius: var(--border-radius-standard);
        cursor: pointer;
        text-decoration: none;
        transition: background-color 0.2s ease-in-out, transform 0.1s ease;
      }

      /* Interaction States */
      .btn-primary:hover {
        background-color: var(--primary-color-hover);
      }

      .btn-primary:active {
        background-color: var(--primary-color-active);
        transform: scale(0.98); /* Subtle press effect */
      }
    </style>
  </head>
  <body>
    <div class="demo-container">
      <h1>Primary Button Demo</h1>
      <p>This button uses our proposed green-themed palette for primary calls-to-action.</p>
      <button class="btn-primary">Login / Register</button>
    </div>
  </body>
</html>
