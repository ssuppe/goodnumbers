# Production Overlay for GCP VM
services:
  backend:
    env_file: .env.production
    volumes:
      # Use server-side path for production GCP secrets (configurable)
      - ${GCP_KEY_PATH_SERVER:-/home/ssuppe/secrets/gcp-key.json}:/app/gcp-key.json:ro

  caddy:
    ports:
      - "80:80"
      - "443:443"

  # Add any other production-only overrides here (e.g. scale, healthchecks)
