# portable base configuration for GoodNumbers
services:
  backend:
    image: goodnumbers-backend:latest
    env_file: ${ENV_FILE:-.env}
    volumes:
      # Persist the SQLite database relative to root
      - ./backend/prisma/dev.db:/app/backend/prisma/dev.db
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      default:
      caddy-proxy:
        aliases:
          - goodnumbers-backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: goodnumbers-frontend:latest
    restart: unless-stopped
    networks:
      default:
      caddy-proxy:
        aliases:
          - goodnumbers-frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  clarity:
    image: nightscout-clarity:latest
    pull_policy: never   # locally-built image, deployed separately from nightscout-lucid/
    restart: unless-stopped
    networks:
      default:
      caddy-proxy:
        aliases:
          - clarity
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  caddy-proxy:
    external: true  # created once on the server: docker network create caddy-proxy

