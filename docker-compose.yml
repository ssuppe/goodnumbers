# Production Docker Compose for GoodNumbers
services:
  backend:
    image: goodnumbers-backend:latest
    env_file: .env.production
    volumes:
      # Persist the SQLite database
      - ./backend/prisma/dev.db:/app/backend/prisma/dev.db
      # Mount the GCP Service Account key file securely
      - /home/ssuppe/secrets/gcp-key.json:/app/gcp-key.json:ro
    restart: unless-stopped
    depends_on:
      - redis

  frontend:
    image: goodnumbers-frontend:latest
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
