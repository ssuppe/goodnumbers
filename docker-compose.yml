# Production Docker Compose for GoodNumbers
services:
  backend:
    image: goodnumbers-backend:latest
    env_file: .env.production
    volumes:
      # Persist the SQLite database
      - ./backend/prisma/dev.db:/app/backend/prisma/dev.db
      # Mount the GCP Service Account key file securely
      - /home/ssuppe/secrets/gcp-key.json:/app/gcp-key.json:ro
    restart: unless-stopped
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # chess:
  #   image: chess-tutor:latest
  #   restart: unless-stopped
  #   expose:
  #     - "3050"
  #   env_file: .env.production
  #   environment:
  #     - PORT=3050
  #   volumes:
  #     - ./chess-wikipedia-cache:/app/public/wikipedia
  #     - ./chess-fixtures-tactics:/app/fixtures/tactics

  frontend:
    image: goodnumbers-frontend:latest
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
      # - chess
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
