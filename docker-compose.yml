# portable base configuration for GoodNumbers
services:
  backend:
    image: goodnumbers-backend:latest
    env_file: ${ENV_FILE:-.env}
    volumes:
      # Persist the SQLite database relative to root
      - ./backend/prisma/dev.db:/app/backend/prisma/dev.db
    restart: unless-stopped
    depends_on:
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: goodnumbers-frontend:latest
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  clarity:
    image: nightscout-clarity:latest
    pull_policy: never   # locally-built image, deployed separately from nightscout-lucid/
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    # Ports are defined in overlays (local vs prod)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - /home/ssuppe/stanfordeld26:/var/www/stanfordeld26
    depends_on:
      - backend
      - frontend
    networks:
      - default
      - caddy-proxy  # shared external network so Caddy can reach services in other compose projects
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  chess:
    image: chess-tutor:latest
    container_name: chess-tutor
    restart: unless-stopped
    volumes:
      - ./chess-wikipedia-cache:/app/public/wikipedia
      - ./chess-fixtures-tactics:/app/fixtures/tactics
    environment:
      - PORT=3050
      - NEXT_PUBLIC_BASE_PATH=/chess
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:

networks:
  caddy-proxy:
    external: true  # created once on the server: docker network create caddy-proxy
